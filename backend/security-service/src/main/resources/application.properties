spring.application.name=security-service

server.port=8084
spring.data.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/auth-db?authSource=admin
spring.data.mongodb.auto-index-creation=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.prefer-ip-address=true


rsa.public-key=classpath:certs/pub.pem
rsa.private-key=classpath:certs/pri.pem
 

spring.cloud.stream.bindings.authProducer-out-0.destination=authTopic
spring.cloud.stream.bindings.authProducer-out-0.contentType=application/json

spring.cloud.function.definition=authConsumer
spring.cloud.stream.bindings.authConsumer-in-0.destination=userTopic
spring.cloud.stream.bindings.authConsumer-in-0.group=user-service-group
spring.cloud.stream.bindings.authConsumer-in-0.contentType=application/json

# spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.brokers=kafka:9092