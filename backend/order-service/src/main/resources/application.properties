spring.application.name=order-service

spring.data.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/order-db?authSource=admin
spring.data.mongodb.auto-index-creation=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.function.definition=orderConsumer
spring.cloud.stream.bindings.orderConsumer-in-0.destination=productTopic
spring.cloud.stream.bindings.orderConsumer-in-0.group=order-service-group
spring.cloud.stream.bindings.orderConsumer-in-0.contentType=application/json
spring.cloud.stream.kafka.binder.brokers=kafka:9092
