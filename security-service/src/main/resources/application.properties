spring.application.name=security-service

server.port=8084
spring.data.mongodb.uri=mongodb://admin:123456@localhost:27017/auth-db?authSource=admin
spring.data.mongodb.auto-index-creation=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
# management.endpoints.web.exposure.include=*
# springdoc.api-docs.enabled=true

rsa.public-key=classpath:certs/pub.pem
rsa.private-key=classpath:certs/pri.pem
 

spring.cloud.stream.bindings.authProducer-out-0.destination=authTopic
spring.cloud.stream.bindings.authProducer-out-0.contentType=application/json
spring.cloud.stream.kafka.binder.brokers=localhost:9092