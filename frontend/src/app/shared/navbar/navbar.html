<header class="navbar">
  <div class="navbar__inner">
    <a
      class="navbar__brand"
      routerLink="/"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: true }"
      #homeLink="routerLinkActive"
    >
      <span class="navbar__mark" aria-hidden="true">&#9917;</span>
      <span class="navbar__name">Sport<span>Market</span></span>
    </a>

    <nav class="navbar__actions" aria-label="Main navigation">
      @if (homeLink.isActive) {
        <button
          type="button"
          class="navbar__search"
          [attr.aria-expanded]="catalogSearchState.isOpen()"
          aria-controls="catalog-search-panel"
          (click)="openCatalogSearch()"
        >
          <span aria-hidden="true">&#128269;</span>
          <span>Search</span>
        </button>
      }
      @if (isAuthenticated()) {
        @if (isSeller()) {
          <a class="navbar__link" routerLink="/dashboard" routerLinkActive="navbar__link--active">
            Dashboard
          </a>
        }
        @if (isClient()) {
          <a
            class="navbar__link navbar__cart"
            routerLink="/cart"
            routerLinkActive="navbar__link--active"
            aria-label="Cart"
          >
            <span aria-hidden="true">&#128722;</span>
            <span>Cart</span>
            @if (cartCount() > 0) {
              <span class="navbar__badge">{{ cartCount() }}</span>
            }
          </a>
          <a class="navbar__link" routerLink="/orders" routerLinkActive="navbar__link--active">
            My Orders
          </a>
        }
        <a class="navbar__link" routerLink="/profile" routerLinkActive="navbar__link--active">
          Profile
        </a>
        <button type="button" class="navbar__btn navbar__btn--ghost" (click)="onLogout()">
          Logout
        </button>
      } @else {
        <a class="navbar__link" routerLink="/login">Login</a>
        <a class="navbar__btn" routerLink="/register">Register</a>
      }
    </nav>
  </div>
</header>
