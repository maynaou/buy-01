spring.application.name=media-service

server.port=8083
spring.datasource.url=jdbc:h2:mem:media-db
spring.h2.console.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.data.rest.base-path=/api
management.endpoints.web.exposure.include=*
# spring.data.mongodb.uri=mongodb://mongodb:27017/media_db

# spring.cloud.function.definition=productConsumer
# spring.cloud.stream.bindings.productConsumer-in-0.destination=productTopic
# spring.cloud.stream.bindings.productConsumer-in-0.group=media-service-group
# spring.cloud.stream.bindings.productConsumer-in-0.contentType=application/json
# spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.function.definition=mediaConsumer
spring.cloud.stream.bindings.mediaConsumer-in-0.destination=productTopic
spring.cloud.stream.bindings.mediaConsumer-in-0.group=media-service-group
spring.cloud.stream.bindings.mediaConsumer-in-0.contentType=application/json

spring.cloud.stream.kafka.binder.brokers=localhost:9092


